# =============================================================================
# Feature — the general-purpose development pipeline
# =============================================================================
#
# Selected by the routing rules in workflow.example.yaml. Runtime config —
# tracker, workspace, hooks, concurrency, the dashboard — lives there and is
# shared by every workflow; only the pipeline and its framing live here.
#
# The `prompts.global_prompt` below is what lets the stage prompts stay free of
# `if this is a bug…` branching: it says once what kind of work this is, so a
# shared review prompt needs no conditional.
# =============================================================================

description: "New work with no existing behaviour to reproduce. The default when nothing else routes."

prompts:
  global_prompt: prompts/global.example.md

states:

  investigate:
    type: agent
    prompt: prompts/investigate.example.md
    linear_state: active
    model: claude-opus-5
    effort: high
    session: inherit
    transitions:
      complete: ground-check

  ground-check:
    type: agent
    prompt: prompts/ground-check.example.md
    linear_state: active
    model: claude-opus-5
    effort: xhigh
    session: fresh
    transitions:
      complete: research-review

  research-review:
    type: gate
    linear_state: review
    rework_to: investigate
    max_rework: 3
    requires_pr: false        # no PR exists yet: nothing for the review loop to watch
    transitions:
      approve: implement

  implement:
    type: agent
    prompt: prompts/implement.example.md
    linear_state: active
    model: claude-sonnet-5
    effort: high
    session: inherit
    transitions:
      complete: implementation-review

  implementation-review:
    type: gate
    linear_state: review
    rework_to: implement
    max_rework: 5
    transitions:
      approve: code-review

  code-review:
    type: agent
    prompt: prompts/review.example.md
    linear_state: active
    model: claude-opus-5
    effort: xhigh
    session: fresh
    transitions:
      complete: merge-review

  # The PR is the gate, and the human merges it: no agent runs `gh pr merge`
  # (the daemon's GitHub account has no business landing its own work). With
  # `github.enabled`, merging the PR ends the ticket and a human review comment
  # sends it to address-review-comments. Moving the Linear ticket to Gate
  # Approved by hand also closes it, without touching the PR.
  merge-review:
    type: gate
    linear_state: review
    rework_to: address-review-comments
    transitions:
      approve: done

  address-review-comments:
    type: agent
    prompt: prompts/address-review-comments.example.md
    linear_state: active
    model: claude-sonnet-5
    effort: high
    session: inherit
    transitions:
      complete: merge-review

  done:
    type: terminal
    linear_state: terminal
